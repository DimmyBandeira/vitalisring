<div class="refresh-state"{% if refresh.status == "pending" %} hx-get="/app/pedidos/{{ refresh.id }}" hx-trigger="every 3s" hx-swap="outerHTML"{% endif %}>{% if refresh.status == "pending" %}<span class="vr-status vr-status--info">Lendo o anel</span><p>Leva cerca de 1 minuto.</p>{% elif refresh.status == "completed" %}<span class="vr-status vr-status--ok">Leitura atualizada</span>{% elif refresh.status == "timeout" %}<span class="vr-status vr-status--info">Sem resposta do anel</span><p>Tente novamente mais tarde.</p>{% endif %}</div>

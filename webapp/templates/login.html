{% extends "base_app.html" %}
{% block content %}
<section class="auth-card" aria-labelledby="login-title">
  <p class="app-eyebrow">Área segura</p>
  <h1 id="login-title">Entre no Vitalis</h1>
  <p>Use o e-mail cadastrado para receber um link seguro de acesso.</p>
  <form class="app-form" method="post" action="/login" aria-describedby="login-help">
    <input type="hidden" name="csrf_token" value="{{ login_csrf }}">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required>
    <button class="vr-btn vr-btn--primary" type="submit">Receber link de acesso</button>
  </form>
  <p class="app-help" id="login-help">Por segurança, o link expira em 15 minutos e funciona uma única vez.</p>
  <p><a href="/login/codigo">Já tenho um código de seis dígitos</a></p>
</section>
{% endblock %}

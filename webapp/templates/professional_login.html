{% extends "base_app.html" %}{% block content %}<section class="auth-card"><p class="app-eyebrow">Acesso profissional</p><h1>Entrar com senha</h1><p>Para médicos, instituições e equipe autorizada.</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post" action="/profissional/login"><input type="hidden" name="csrf_token" value="{{ login_csrf }}"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="vr-btn vr-btn--primary" type="submit">Continuar</button></form><p><a href="/login">Acesso da família</a></p></section>{% endblock %}

{% extends "base_app.html" %}{% block content %}<section class="auth-card"><p class="app-eyebrow">Proteção obrigatória</p><h1>Configure o autenticador</h1><p>Escaneie o QR no seu aplicativo autenticador. O SVG é gerado localmente.</p><div class="totp-qr">{{ qr_svg }}</div><details><summary>Não consegue escanear?</summary><code>{{ secret }}</code></details>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post" action="/profissional/configurar-mfa"><input type="hidden" name="csrf_token" value="{{ login_csrf }}"><label for="code">Código de 6 dígitos</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required><button class="vr-btn vr-btn--primary" type="submit">Ativar MFA</button></form></section>{% endblock %}
